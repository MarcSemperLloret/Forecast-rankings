[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-rank-reference-pilot"
version = "0.1.0"
description = "Minimal reproducible pilot for reference-sensitive weather-model rankings"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyproj>=3.7",
  "PyYAML>=6.0",
  "xarray>=2024.10",
  "requests>=2.31",
  "scipy>=1.14",
  "shapely>=2.0",
  "zarr<3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
